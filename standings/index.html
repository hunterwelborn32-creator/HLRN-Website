<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HLRN Standings</title>
<meta name="robots" content="index,follow">
<script>
(function(){
  const allowed=new Set(["hosted","sunday","monday"]);
  const params=new URLSearchParams(location.search);
  let series=String(params.get("series")||"").toLowerCase();
  if(!allowed.has(series)){
    series=String(location.hash||"").replace(/^#/,"").toLowerCase();
  }
  if(!allowed.has(series)){
    try{series=sessionStorage.getItem("hlrnStandingsSeries")||""}catch(e){}
  }
  if(!allowed.has(series)) series="sunday";
  try{sessionStorage.setItem("hlrnStandingsSeries",series)}catch(e){}
  location.replace("./"+series+".html");
})();
</script>
</head>
<body></body>
</html>
