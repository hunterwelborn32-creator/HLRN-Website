<!DOCTYPE html>
<html lang="en" data-hlrn-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HLRN Championship Standings | High Line Racing Network</title>
<meta name="description" content="Current High Line Racing Network Sunday, Monday and Hosted championship standings, points and driver rankings.">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="https://highlineracingnetwork.com/standings/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#000;
  --panel:#07090b;
  --panel2:#0d1013;
  --text:#fff;
  --muted:#8e969e;
  --line:#2b3137;
  --red:#ed1c24;
  --green:#69e000;
  --yellow:#ffd400;
}
html[data-hlrn-theme="light"]{
  --bg:#f3f5f7;
  --panel:#fff;
  --panel2:#f7f8f9;
  --text:#111318;
  --muted:#68717a;
  --line:#d5dbe0;
}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}
body{overflow-x:hidden}
.standings-shell{
  min-height:100vh;
  background:var(--bg);
}
.standings-head{
  padding:18px 22px 15px;
  border-top:4px solid var(--yellow);
  border-bottom:1px solid var(--line);
  background:var(--panel);
}
.kicker{
  margin-bottom:5px;
  color:var(--yellow);
  font:900 9px/1 "Barlow Condensed",Arial,sans-serif;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.standings-head h1{
  margin:0;
  color:var(--text);
  font:italic 900 clamp(36px,5vw,66px)/.9 "Barlow Condensed",Arial,sans-serif;
  letter-spacing:-.045em;
  text-transform:uppercase;
}
.standings-head h1 span{color:var(--yellow)}
.standings-head p{
  margin:8px 0 0;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}
.series-tabs{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:0;
  border-bottom:1px solid var(--line);
  background:var(--panel);
}
.series-tab{
  appearance:none;
  border:0;
  border-right:1px solid var(--line);
  min-height:56px;
  padding:10px 16px;
  background:var(--panel);
  color:var(--muted);
  cursor:pointer;
  text-align:left;
  position:relative;
  font:italic 900 18px/1 "Barlow Condensed",Arial,sans-serif;
  text-transform:uppercase;
}
.series-tab:last-child{border-right:0}
.series-tab:hover{background:var(--panel2);color:var(--text)}
.series-tab.active{background:var(--panel2);color:var(--text)}
.series-tab.active:after{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  bottom:0;
  height:4px;
  border-radius:4px 4px 0 0;
}
.series-tab[data-series="hosted"].active:after{background:var(--yellow)}
.series-tab[data-series="sunday"].active:after{background:var(--red)}
.series-tab[data-series="monday"].active:after{background:var(--green)}
.series-tab[data-series="hosted"] strong{color:var(--yellow)}
.series-tab[data-series="sunday"] strong{color:var(--red)}
.series-tab[data-series="monday"] strong{color:var(--green)}
.frame-wrap{
  width:100%;
  background:var(--bg);
  border:0;
  padding:0;
}
.standings-frame{
  display:none;
  width:100%;
  height:calc(100vh - 185px);
  min-height:720px;
  border:0;
  outline:0;
  box-shadow:none;
  background:var(--bg);
  color-scheme:dark;
}
html[data-hlrn-theme="light"] .standings-frame{color-scheme:light}
.standings-frame.active{display:block}
.loading-note{
  display:none;
  padding:16px 20px;
  color:var(--muted);
  background:var(--bg);
  font-size:11px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.loading-note.active{display:block}
@media(max-width:700px){
  .standings-head{padding:14px 12px 12px}
  .standings-head h1{font-size:42px}
  .series-tab{min-height:48px;padding:9px 8px;text-align:center;font-size:14px}
  .standings-frame{height:calc(100vh - 165px);min-height:620px}
}
</style>
</head>
<body>
<div class="standings-shell">
  <header class="standings-head">
    <div class="kicker">High Line Racing Network</div>
    <h1>2026 HLRN <span>Standings &amp; Stats</span></h1>
    <p>Hosted, Sunday and Monday championship standings, results and driver statistics.</p>
  </header>

  <nav class="series-tabs" aria-label="HLRN standings series">
    <button type="button" class="series-tab" data-series="hosted"><strong>Hosted</strong></button>
    <button type="button" class="series-tab active" data-series="sunday"><strong>Sunday</strong></button>
    <button type="button" class="series-tab" data-series="monday"><strong>Monday</strong></button>
  </nav>

  <main class="frame-wrap">
    <div class="loading-note" id="standingsLoading">Loading standings…</div>

    <iframe
      class="standings-frame"
      id="frame-hosted"
      title="HLRN Hosted Racing"
      data-src="hosted.html?v=20261001cleanwrapper1"
      scrolling="auto"></iframe>

    <iframe
      class="standings-frame active"
      id="frame-sunday"
      title="HLRN Sunday Championship"
      src="sunday.html?v=20261001cleanwrapper1"
      scrolling="auto"></iframe>

    <iframe
      class="standings-frame"
      id="frame-monday"
      title="HLRN Monday Championship"
      data-src="monday.html?v=20261001cleanwrapper1"
      scrolling="auto"></iframe>
  </main>
</div>

<script>
(function(){
  const allowed=new Set(["hosted","sunday","monday"]);
  const tabs=[...document.querySelectorAll(".series-tab")];
  const frames=[...document.querySelectorAll(".standings-frame")];
  const loading=document.getElementById("standingsLoading");

  function ensureLoaded(frame){
    if(frame.src)return;
    const src=frame.dataset.src;
    if(src)frame.src=src;
  }

  function show(series,updateHash=true){
    if(!allowed.has(series))series="sunday";
    const target=document.getElementById("frame-"+series);
    if(!target)return;

    if(loading)loading.classList.add("active");
    ensureLoaded(target);

    tabs.forEach(tab=>tab.classList.toggle("active",tab.dataset.series===series));
    frames.forEach(frame=>frame.classList.toggle("active",frame===target));

    if(updateHash){
      try{history.replaceState(null,"",location.pathname+location.search+"#"+series);}catch(e){}
    }

    if(target.dataset.hlrnReady==="1"){
      if(loading)loading.classList.remove("active");
    }
  }

  frames.forEach(frame=>{
    frame.addEventListener("load",()=>{
      frame.dataset.hlrnReady="1";
      if(frame.classList.contains("active") && loading)loading.classList.remove("active");
    });
  });

  tabs.forEach(tab=>tab.addEventListener("click",()=>show(tab.dataset.series,true)));

  let initial=String(location.hash||"").replace(/^#/,"").toLowerCase();
  if(!allowed.has(initial))initial="sunday";
  show(initial,false);

  window.addEventListener("hashchange",()=>{
    const requested=String(location.hash||"").replace(/^#/,"").toLowerCase();
    if(allowed.has(requested))show(requested,false);
  });
})();
</script>
<script src="../assets/site-shell.js?v=20261001standingscleanwrapper1"></script>
</body>
</html>
