name: Sync HLRN announcements

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    paths:
      - '.github/workflows/sync-announcements.yml'
      - 'tools/sync-announcements.py'

permissions:
  contents: write

concurrency:
  group: hlrn-announcements-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mirror Discord announcements
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ANCHOR_CHANNEL_ID: '1528189461656244364'
        run: python tools/sync-announcements.py

      - name: Commit announcement feed
        run: |
          git config user.name "HLRN Announcements Sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/announcements.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync Discord announcements"
            git push
          fi
