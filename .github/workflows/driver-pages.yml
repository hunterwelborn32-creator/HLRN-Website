name: Build permanent driver pages

on:
  push:
    paths:
      - 'tools/build-driver-pages.py'
      - 'tools/build-sitemap.py'
      - 'tests/test_driver_pages.py'
      - 'drivers/index.html'
      - 'data/derived/profiles.json'
      - 'data/hlrn.json'
      - '.github/workflows/driver-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hlrn-driver-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test permanent driver profiles
        run: python -m unittest tests/test_driver_pages.py

      - name: Generate permanent driver profiles
        run: python tools/build-driver-pages.py

      - name: Rebuild sitemap
        run: python tools/build-sitemap.py

      - name: Commit generated driver profiles
        run: |
          git config user.name "hlrn-driver-pages-bot"
          git config user.email "actions@users.noreply.github.com"

          commit_generated() {
            git add drivers data/driver-pages.json sitemap.xml
            if git diff --cached --quiet; then
              return 1
            fi
            git commit -m "Build permanent HLRN driver profile pages"
            return 0
          }

          if ! commit_generated; then
            echo "No generated driver-page changes to publish."
            exit 0
          fi

          # Other site workflows can update main while this generator is running.
          # Retry on a fresh main instead of failing on a moving branch ref.
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt"
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Generated files conflicted with a newer main; regenerating from latest."
              git rebase --abort || true
              git reset --hard origin/main
              python tools/build-driver-pages.py
              python tools/build-sitemap.py
              if ! commit_generated; then
                echo "Latest main already contains the generated output."
                exit 0
              fi
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep $((attempt * 2))
          done

          echo "Unable to publish generated driver pages after retries."
          exit 1
