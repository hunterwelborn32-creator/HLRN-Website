name: Verify Pack Separation
on:
  pull_request:
    paths:
      - "track-map/**"
      - "tests/pack-layout.test.mjs"
      - ".github/workflows/verify-pack-layout.yml"
  workflow_dispatch:
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/pack-layout.test.mjs
      - run: node tests/live-track-map.test.mjs
