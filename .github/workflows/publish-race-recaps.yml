name: Publish HLRN Race Recaps — Manual Only

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which recorder archive to publish?"
        required: true
        type: choice
        default: render
        options:
          - render
          - cloudflare

permissions:
  contents: write

concurrency:
  group: hlrn-race-recap-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HLRN_RECAP_URL: ${{ inputs.source == 'cloudflare' && 'https://hlrn-live-feed.hunterwelborn32.workers.dev/api/recaps' || 'https://hlrn-live-feed.onrender.com/api/recaps' }}
      HLRN_PUBLISH_APPROVED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test race recap publisher
        run: python -m unittest tests/test_race_recap_publisher.py

      - name: Confirm selected archive source
        run: echo "HLRN recap source is ${{ inputs.source }}"

      - name: Publish recorder archive manually
        run: python tools/publish-race-recap.py

      - name: Refresh sitemap
        run: python tools/build-sitemap.py

      - name: Save manually published recorder archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hlrn-race-recap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/race-recaps
          if [ -d news/race-recaps ]; then git add news/race-recaps; fi
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          if git diff --cached --quiet; then
            echo "No recorder archive changes."
            exit 0
          fi
          git commit -m "Publish HLRN race recap manually"
          git push origin HEAD:main
