name: Sync HLRN data
on:
  push:
    paths:
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/sync-hlrn-data.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hlrn-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test expansion scripts
        run: node --test tests/*.test.mjs
      - name: Test race recap publisher
        run: python -m unittest tests/test_race_recap_publisher.py
      - name: Refresh leagues and optional Hosted snapshot
        env:
          HLRN_LEAGUE_WEBAPP_URL: ${{ secrets.HLRN_LEAGUE_WEBAPP_URL }}
          HLRN_HOSTED_WEBAPP_URL: ${{ secrets.HLRN_HOSTED_WEBAPP_URL }}
        run: node tools/sync-data.mjs
      - name: Build published reports and profiles
        run: node tools/build-derived.mjs
      - name: Publish frozen post-race recap when available
        env:
          HLRN_RECAP_URL: https://hlrn-live-feed.onrender.com/api/recap
        run: python tools/publish-race-recap.py
      - name: Commit verified data, reports and race recaps only when changed
        run: |
          git add data/hlrn.json data/derived data/race-recaps
          if [ -d news/race-recaps ]; then git add news/race-recaps; fi
          if ! git diff --cached --quiet; then
            git config user.name "hlrn-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Sync HLRN data, reports and driver profiles"
            git push
          fi
