name: Sync Broadcast Center

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - ".github/workflows/sync-broadcast-center.yml"
      - "tools/update-broadcasts.py"

permissions:
  contents: write

concurrency:
  group: sync-broadcast-center
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube reader
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Find latest Sunday broadcast
        run: python tools/update-broadcasts.py

      - name: Save broadcast data
        run: |
          if [ -z "$(git status --porcelain -- data/broadcasts.json)" ]; then
            echo "Broadcast data already current."
            exit 0
          fi
          git config user.name "HLRN Broadcast Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/broadcasts.json
          git commit -m "Update Sunday broadcast replay"
          git push
