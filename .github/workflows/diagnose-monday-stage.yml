name: Diagnose Monday Stage Feed

on:
  push:
    paths:
      - '.github/workflows/diagnose-monday-stage.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare scoring config only
        run: |
          python - <<'PY'
          import json, urllib.request

          def get(season):
              url=f"https://simracerhub.com/get_standings.php?season_id={season}&_diag=4"
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json,text/javascript,*/*"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode("utf-8","replace"))

          def primitives(obj,prefix=""):
              out={}
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      p=f"{prefix}.{k}" if prefix else str(k)
                      if isinstance(v,(str,int,float,bool,type(None))):
                          out[p]=v
                      elif isinstance(v,dict):
                          out.update(primitives(v,p))
              return out

          sun=get(29832)
          mon=get(30442)

          for top in ("seasons","lss","disp"):
              a=primitives(sun.get(top))
              b=primitives(mon.get(top))
              keys=sorted(set(a)|set(b))
              print("===",top.upper(),"DIFFS===")
              for k in keys:
                  av=a.get(k,"<MISSING>"); bv=b.get(k,"<MISSING>")
                  if av!=bv:
                      print(k,"| SUN=",repr(av),"| MON=",repr(bv))

          print("===RACE MAP SHAPES===")
          for label,d in (("SUN",sun),("MON",mon)):
              for s in d.get("schedules") or []:
                  if not isinstance(s,dict): continue
                  print(label,s.get("schedule_id"),json.dumps(s.get("race_id"),sort_keys=True), "config",s.get("config_id"))
          PY
