name: Diagnose Monday Stage Feed

on:
  push:
    paths:
      - '.github/workflows/diagnose-monday-stage.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Monday SimRacerHub stage data
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse

          url = "https://simracerhub.com/get_standings.php?season_id=30442&_hlrn_stage_diag=1"
          req = urllib.request.Request(url, headers={
              "User-Agent":"Mozilla/5.0",
              "Accept":"application/json,text/javascript,*/*"
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              raw = r.read().decode("utf-8", "replace")
              print("HTTP", r.status)
              print("BYTES", len(raw))
          data = json.loads(raw)
          print("TOP_KEYS", sorted(data.keys()))
          rps = data.get("rps") or {}
          print("DRIVERS", len(rps))

          def n(v):
              try: return float(v)
              except: return 0

          ordered = sorted(rps.items(), key=lambda kv: n((kv[1] or {}).get("pos2") or (kv[1] or {}).get("pos1") or 9999))
          for did, d in ordered[:15]:
              races = (d or {}).get("races") or {}
              sessions = {}
              nonrace = []
              for rid, race in races.items():
                  if not isinstance(race, dict):
                      continue
                  s = str(race.get("session") or "<none>")
                  sessions[s] = sessions.get(s,0)+1
                  if s not in ("RACE","<none>"):
                      nonrace.append({
                          "raceId":rid,
                          "session":race.get("session"),
                          "finish_pos":race.get("finish_pos"),
                          "points":race.get("points"),
                          "pts":race.get("pts"),
                          "spts":race.get("spts"),
                          "stage_points":race.get("stage_points"),
                          "keys":sorted(race.keys())
                      })
              print("DRIVER", json.dumps({
                  "id":did,
                  "name":d.get("name"),
                  "pos":d.get("pos2") or d.get("pos1"),
                  "tpts":d.get("tpts"),
                  "rpts":d.get("rpts"),
                  "spts":d.get("spts"),
                  "bpts":d.get("bpts"),
                  "ppts":d.get("ppts"),
                  "sessions":sessions,
                  "nonrace":nonrace[:5],
                  "driver_keys":sorted(d.keys())
              }, separators=(",",":")))

          hits=[]
          def walk(x,path="$"):
              if len(hits)>=200: return
              if isinstance(x,dict):
                  for k,v in x.items():
                      lk=str(k).lower()
                      if "stage" in lk or "segment" in lk or lk=="session" or lk=="spts":
                          simple=v if isinstance(v,(str,int,float,bool,type(None))) else f"<{type(v).__name__}>"
                          hits.append((path+"."+str(k),simple))
                      walk(v,path+"."+str(k))
              elif isinstance(x,list):
                  for i,v in enumerate(x[:100]):
                      walk(v,path+f"[{i}]")
          walk(data)
          print("STAGE_RELATED_HITS", len(hits))
          for p,v in hits:
              print("HIT",p,repr(v))

          # Inspect schedule payload embedded in the public season page.
          surl="https://simracerhub.com/season_standings.php?season_id=30442"
          req2=urllib.request.Request(surl,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req2,timeout=30) as r:
              page=r.read().decode("utf-8","replace")
          print("SEASON_PAGE_BYTES",len(page))
          marker='"schedules":['
          print("HAS_SCHEDULES",marker in page)
          if marker in page:
              pos=page.index(marker)+len('"schedules":')
              depth=0; ins=False; esc=False; end=None
              for i,ch in enumerate(page[pos:],start=pos):
                  if ins:
                      if esc: esc=False
                      elif ch=="\\": esc=True
                      elif ch=='"': ins=False
                      continue
                  if ch=='"': ins=True; continue
                  if ch=="[": depth+=1
                  elif ch=="]":
                      depth-=1
                      if depth==0:
                          end=i+1; break
              if end:
                  arr=json.loads(page[pos:end])
                  print("SCHEDULE_COUNT",len(arr))
                  for s in arr[:15]:
                      print("SCHEDULE",json.dumps({k:s.get(k) for k in s.keys() if k in ("id","schedule_id","race_id","race_num","track_name","race_date_fmt","race_date","name","session")},separators=(",",":")))
          PY
