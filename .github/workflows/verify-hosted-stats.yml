name: Verify Hosted Stat Correction
on:
  pull_request:
    paths:
      - "data/hlrn.json"
      - "data/derived/profiles.json"
      - "tools/sync-data.mjs"
      - "tests/hosted-tommy-wins.test.mjs"
      - ".github/workflows/verify-hosted-stats.yml"
  workflow_dispatch:
jobs:
  hosted-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/hosted-tommy-wins.test.mjs
