name: HLRN Adventures Discord Publisher
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: hlrn-adventures-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import completed Discord episodes
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: '1528189461656244364'
          JIM_USER_ID: '1051673096463077386'
        run: python tools/publish.py
      - name: Commit published episodes and site library
        run: |
          git config user.name "HLRN Adventure Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add adventures/
          if ! git diff --cached --quiet; then
            git commit -m "Publish completed Adventures from Discord"
            git push
          fi
