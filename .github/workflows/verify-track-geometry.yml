name: Verify Track Geometry
on:
  pull_request:
    paths:
      - "track-map/**"
      - "tests/track-geometry.test.mjs"
  push:
    branches: [main]
    paths:
      - "track-map/**"
      - "tests/track-geometry.test.mjs"
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tests/track-geometry.test.mjs
      - run: node tests/circuit-sources.test.mjs
