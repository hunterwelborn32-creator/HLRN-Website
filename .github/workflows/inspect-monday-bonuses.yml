name: Inspect SimRacerHub Standings Fields

on:
  push:
    paths:
      - '.github/workflows/inspect-monday-bonuses.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print standings driver fields
        run: |
          python - <<'PY'
          import json, urllib.request
          for season,label in [(29832,"SUNDAY"),(30442,"MONDAY")]:
              url=f"https://simracerhub.com/get_standings.php?season_id={season}&_fields=1"
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  d=json.loads(r.read().decode())
              rps=d.get("rps") or {}
              rows=sorted(rps.items(),key=lambda kv: float((kv[1] or {}).get("pos2") or (kv[1] or {}).get("pos1") or 9999))
              print("===",label,"===")
              for did,x in rows[:3]:
                  print("DRIVER_ID",did)
                  for k in sorted(x.keys()):
                      if k=="races": continue
                      print(k,"=",repr(x.get(k)))
                  break
          PY
