name: Inspect SimRacerHub Team Cells

on:
  push:
    paths:
      - '.github/workflows/inspect-monday-bonuses.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect standings team HTML
        run: |
          python - <<'PY'
          import urllib.request
          for season,label,names in [
            (29832,"SUNDAY",["Trevor Haley","Nicholas Baumann"]),
            (30442,"MONDAY",["Bill Daniels","Javone Thompson","Hunter Welborn"])
          ]:
              url=f"https://simracerhub.com/season_standings.php?season_id={season}"
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  page=r.read().decode("utf-8","replace")
              low=page.lower()
              print("===",label,"===")
              for name in names:
                  i=low.find(name.lower())
                  print("NAME",name,"AT",i)
                  if i>=0: print(page[max(0,i-1200):i+2600])
          PY
