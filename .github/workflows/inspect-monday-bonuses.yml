name: Inspect Monday Bonus Breakdown

on:
  push:
    paths:
      - '.github/workflows/inspect-monday-bonuses.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Texas bonus page
        run: |
          python - <<'PY'
          import urllib.request,re,html
          url="https://simracerhub.com/season_race.php?race_id=382159&scbp=y"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=30) as r:
              page=r.read().decode("utf-8","replace")
          print("BYTES",len(page))
          low=page.lower()
          for needle in ["driver bonuses","stage 1st place","stage 2nd place","stage 3rd place","stage 4th place","stage 5th place"]:
              i=low.find(needle)
              print("NEEDLE",needle,"AT",i)
              if i>=0:
                  print(page[max(0,i-1800):i+3500])
                  print("-----")
          PY
