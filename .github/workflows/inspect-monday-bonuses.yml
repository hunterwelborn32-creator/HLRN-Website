name: Inspect SimRacerHub Teams Source

on:
  push:
    paths:
      - '.github/workflows/inspect-monday-bonuses.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Monday team sections
        run: |
          python - <<'PY'
          import urllib.request
          url="https://simracerhub.com/teams.php?season_id=30442"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=30) as r:
              page=r.read().decode("utf-8","replace")
          low=page.lower()
          print("BYTES",len(page))
          for needle in ["gen x","helix","jsr","lbs","team_"]:
              pos=0
              print("==",needle,"==")
              for _ in range(4):
                  i=low.find(needle,pos)
                  if i<0: break
                  print(page[max(0,i-1200):i+3500])
                  print("-----")
                  pos=i+len(needle)
          PY
