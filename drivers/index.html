<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HLRN Drivers | High Line Racing Network</title>
<link rel="stylesheet" href="../assets/site-shell.css">
<style>
:root{
  --hlrn-red:#d71920;
  --hlrn-black:#111111;
  --hlrn-ink:#171717;
  --hlrn-muted:#6f747b;
  --hlrn-bg:#f4f4f4;
  --hlrn-card:#fff;
  --hlrn-line:#dedede;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--hlrn-bg);color:var(--hlrn-ink);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
img{max-width:100%}

.driver-page{min-height:100vh;background:#f4f4f4;padding-bottom:72px}
.driver-heading{background:#fff;border-bottom:1px solid #d8d8d8}
.driver-heading-inner{width:min(1450px,calc(100% - 36px));margin:auto;padding:34px 0 29px}
.eyebrow{display:flex;align-items:center;gap:9px;color:#6a6f76;font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;margin-bottom:7px}
.eyebrow:before{content:"";width:28px;height:4px;background:var(--hlrn-red);transform:skewX(-16deg)}
.driver-heading h1{margin:0;font-size:clamp(34px,4.8vw,61px);line-height:.98;font-weight:1000;letter-spacing:-.045em;text-transform:uppercase;color:#111}
.driver-heading h1 span{color:var(--hlrn-red)}
.driver-heading p{margin:11px 0 0;color:#686d73;font-size:14px;font-weight:700}

.roster-tools{width:min(1450px,calc(100% - 36px));margin:24px auto 18px;display:flex;align-items:center;gap:14px;justify-content:space-between}
.roster-title{font-size:18px;font-weight:1000;letter-spacing:-.01em;text-transform:uppercase}
.roster-count{color:#777;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.search-wrap{position:relative;width:min(360px,100%)}
.search-wrap input{width:100%;height:42px;border:1px solid #cfd2d5;background:#fff;padding:0 42px 0 14px;color:#111;font-size:13px;font-weight:700;outline:none}
.search-wrap input:focus{border-color:#8b8f94;box-shadow:0 0 0 2px rgba(0,0,0,.05)}
.search-wrap:after{content:"⌕";position:absolute;right:14px;top:50%;transform:translateY(-54%);font-size:22px;color:#777}

.driver-grid{width:min(1450px,calc(100% - 36px));margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.driver-card{position:relative;display:block;border:1px solid #d6d6d6;background:#fff;min-width:0;text-decoration:none;color:#111;overflow:hidden;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.driver-card:hover{transform:translateY(-3px);box-shadow:0 9px 24px rgba(0,0,0,.13);border-color:#bbb}
.driver-card:focus-visible{outline:3px solid #111;outline-offset:2px}
.driver-media{position:relative;height:300px;background:linear-gradient(180deg,#ececec 0%,#f8f8f8 54%,#e7e7e7 100%);overflow:hidden}
.driver-media:after{content:"";position:absolute;left:0;right:0;bottom:0;height:32%;background:linear-gradient(180deg,transparent,rgba(0,0,0,.08));pointer-events:none}
.driver-cutout{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);height:95%;width:auto;max-width:90%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 8px 8px rgba(0,0,0,.18));z-index:2}
.driver-fallback{position:absolute;inset:0;z-index:1;display:grid;place-items:center;color:#c2c2c2;font-size:74px;font-weight:1000;font-style:italic;letter-spacing:-.06em}
.number-badge{position:absolute;top:0;left:0;z-index:4;min-width:78px;height:64px;padding:0 14px 0 12px;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;font-size:34px;font-weight:1000;font-style:italic;letter-spacing:-.07em;clip-path:polygon(0 0,100% 0,87% 100%,0 100%)}
.number-badge:after{content:"";position:absolute;left:0;bottom:0;width:100%;height:5px;background:var(--hlrn-red)}
.status-chip{position:absolute;right:11px;top:11px;z-index:5;background:rgba(255,255,255,.94);border:1px solid #d5d5d5;padding:7px 9px;color:#353535;font-size:8px;font-weight:1000;letter-spacing:.13em;text-transform:uppercase}

.driver-info{padding:17px 17px 14px;background:#fff;border-top:1px solid #d9d9d9;min-height:116px}
.driver-name{font-size:20px;line-height:1.02;font-weight:1000;letter-spacing:-.028em;text-transform:uppercase;color:#171717;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.driver-sub{margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#74787d;font-size:10px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}
.driver-sub strong{color:#111}
.driver-stats{margin-top:14px;padding-top:12px;border-top:1px solid #e2e2e2;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.mini-stat{min-width:0}
.mini-stat b{display:block;font-size:14px;color:#111;line-height:1}
.mini-stat span{display:block;margin-top:4px;font-size:7px;color:#8a8e93;font-weight:900;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.win-mark{display:inline-flex;align-items:center;gap:5px}
.win-mark:before{content:"▰";color:#111;transform:skewX(-15deg);font-size:10px}

.loading-card,.error-card,.no-card{grid-column:1/-1;padding:55px 20px;background:#fff;border:1px solid #ddd;text-align:center;color:#73777d;font-size:13px;font-weight:800}
.spinner{width:28px;height:28px;border:3px solid #ddd;border-top-color:#111;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

.profile-view{display:none;background:#fff;min-height:calc(100vh - 68px)}
.profile-shell{width:min(1450px,calc(100% - 36px));margin:auto;padding:26px 0 70px}
.profile-back{border:0;background:#111;color:#fff;padding:12px 18px;font-size:10px;font-weight:1000;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.profile-back:hover{background:var(--hlrn-red)}
.profile-hero{margin-top:22px;display:grid;grid-template-columns:minmax(300px,460px) 1fr;background:#f1f1f1;border:1px solid #ddd;min-height:440px;overflow:hidden}
.profile-photo{position:relative;overflow:hidden;background:linear-gradient(180deg,#dedede,#f5f5f5)}
.profile-photo .profile-cutout{position:absolute;height:96%;max-width:96%;width:auto;left:50%;bottom:-3px;transform:translateX(-50%);object-fit:contain;filter:drop-shadow(0 12px 12px rgba(0,0,0,.2))}
.profile-number{position:absolute;z-index:3;left:0;top:0;background:#111;color:#fff;min-width:106px;height:82px;display:flex;align-items:center;justify-content:center;font-size:45px;font-weight:1000;font-style:italic;clip-path:polygon(0 0,100% 0,87% 100%,0 100%);border-bottom:6px solid var(--hlrn-red)}
.profile-copy{padding:46px 42px;background:#fff;display:flex;flex-direction:column;justify-content:center}
.profile-kicker{font-size:10px;font-weight:1000;letter-spacing:.16em;color:var(--hlrn-red);text-transform:uppercase}
.profile-copy h2{margin:7px 0 4px;font-size:clamp(35px,5vw,70px);line-height:.91;font-weight:1000;letter-spacing:-.055em;text-transform:uppercase}
.profile-copy p{margin:5px 0 0;color:#7b7f84;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.profile-stats{margin-top:28px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid #ddd;background:#fff}
.profile-stat{padding:21px 16px;border-right:1px solid #ddd}.profile-stat:last-child{border-right:0}
.profile-stat b{display:block;font-size:29px;line-height:1;font-weight:1000}.profile-stat span{display:block;margin-top:6px;font-size:8px;color:#888;font-weight:1000;text-transform:uppercase;letter-spacing:.1em}
.history-wrap{margin-top:28px;border:1px solid #ddd;background:#fff;overflow:auto}
.history-head{padding:17px 18px;border-bottom:1px solid #ddd;font-size:13px;font-weight:1000;text-transform:uppercase}
table{width:100%;border-collapse:collapse;min-width:840px}th,td{padding:13px 14px;border-bottom:1px solid #e5e5e5;text-align:left;font-size:11px}th{background:#f3f3f3;color:#666;font-size:8px;text-transform:uppercase;letter-spacing:.08em}td{font-weight:700}.win{color:var(--hlrn-red);font-weight:1000}.top5{font-weight:1000}

@media(max-width:1180px){.driver-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.driver-media{height:285px}.profile-stats{grid-template-columns:repeat(3,1fr)}.profile-stat:nth-child(3){border-right:0}.profile-stat{border-bottom:1px solid #ddd}.profile-stat:nth-child(n+4){border-bottom:0}}
@media(max-width:850px){.driver-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.roster-tools{align-items:flex-start;flex-direction:column}.search-wrap{width:100%}.profile-hero{grid-template-columns:1fr}.profile-photo{height:390px}.profile-copy{padding:30px 24px}.profile-stats{grid-template-columns:repeat(2,1fr)}.profile-stat:nth-child(odd){border-right:1px solid #ddd}.profile-stat:nth-child(even){border-right:0}.profile-stat{border-bottom:1px solid #ddd}.profile-stat:nth-last-child(-n+2){border-bottom:0}}
@media(max-width:520px){.driver-heading-inner,.roster-tools,.driver-grid,.profile-shell{width:min(100% - 22px,1450px)}.driver-heading-inner{padding:26px 0 22px}.driver-grid{grid-template-columns:1fr;gap:13px}.driver-media{height:330px}.driver-info{min-height:0}.driver-name{font-size:22px}.number-badge{min-width:82px;height:66px;font-size:35px}.profile-photo{height:350px}.profile-stats{grid-template-columns:repeat(2,1fr)}}
.league-tabs{width:min(1450px,calc(100% - 36px));margin:24px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}.league-tab{padding:17px 10px;border:2px solid #ddd;background:#fff;color:#333;font-weight:1000;letter-spacing:.08em;cursor:pointer}.league-tab[data-league="sunday"].active{background:#b71920;color:white;border-color:#b71920}.league-tab[data-league="monday"].active{background:#176d38;color:white;border-color:#176d38}.league-tab:focus-visible{outline:3px solid #111;outline-offset:2px}body.monday-league .eyebrow:before,body.monday-league .number-badge:after{background:#176d38}body.monday-league .driver-heading h1 span,body.monday-league .profile-kicker,body.monday-league .win{color:#176d38}body.monday-league .profile-number{border-bottom-color:#176d38}body.monday-league .profile-back:hover{background:#176d38}@media(max-width:520px){.league-tabs{width:calc(100% - 22px)}.league-tab{font-size:11px;padding:14px 5px}}

/* F1-inspired HLRN driver profile — suit-specific color, directory unchanged */
.profile-view{background:#0e1015;color:#fff;min-height:100vh}
.profile-shell{width:min(1510px,calc(100% - 32px));padding:18px 0 65px}
.profile-back{background:#232732;border:1px solid #414550;border-radius:3px;position:relative;z-index:4}
.profile-hero{--suit:#292d35;--suit-dark:#15181e;--suit-accent:#e6343b;position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(270px,.88fr) minmax(235px,.55fr);min-height:610px;margin-top:15px;border:0;background:linear-gradient(125deg,var(--suit-dark),var(--suit) 52%,var(--suit-dark));overflow:hidden;isolation:isolate}
.profile-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 56% 42%,rgba(255,255,255,.13),transparent 48%),repeating-linear-gradient(150deg,transparent 0 125px,rgba(255,255,255,.025) 126px 127px);pointer-events:none;z-index:-1}
.profile-copy{grid-column:1;grid-row:1;z-index:3;background:none;padding:55px 10px 110px 54px;justify-content:flex-start;align-items:flex-start;min-width:0}
.profile-kicker{color:#fff;opacity:.76;letter-spacing:.23em;font-size:11px}
.profile-copy h2{color:#fff;font-size:clamp(43px,5.8vw,90px);line-height:.91;margin:34px 0 20px;overflow-wrap:anywhere;text-shadow:0 2px 18px rgba(0,0,0,.15)}
.profile-copy p{color:#fff;opacity:.88;font-size:12px;line-height:1.65}
.profile-identity-number{font-size:clamp(70px,10vw,145px);line-height:1;font-weight:1000;font-style:italic;letter-spacing:-.12em;color:rgba(255,255,255,.19);margin-top:22px}
.profile-label{display:inline-block;margin-top:17px;padding:8px 12px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}
.profile-photo{grid-column:2;grid-row:1;min-height:610px;z-index:2;background:none;overflow:visible;pointer-events:none}
.profile-photo .profile-cutout{height:95%;max-width:none;width:auto;max-height:650px;bottom:0;left:50%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 15px 23px rgba(0,0,0,.28))}
.profile-number{display:none}
.profile-hero-stats{grid-column:3;grid-row:1;align-self:stretch;z-index:3;background:linear-gradient(90deg,rgba(0,0,0,.10),rgba(0,0,0,.32));padding:28px 27px;display:flex;flex-direction:column;justify-content:center;border-left:1px solid rgba(255,255,255,.12)}
.profile-hero-stats h3{font-size:15px;letter-spacing:.09em;text-transform:uppercase;margin:0 0 20px;color:#fff}
.profile-hero-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 13px}
.profile-hero-stat{border-top:1px solid rgba(255,255,255,.3);padding-top:11px;min-width:0}
.profile-hero-stat span{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.75);display:block;line-height:1.4}
.profile-hero-stat b{font-size:clamp(19px,2.4vw,31px);line-height:1.25;color:#fff;display:block;margin-top:8px;overflow-wrap:anywhere}
.profile-section-heading{margin:31px 0 14px;display:flex;align-items:center;gap:11px;color:#fff;font-size:20px;text-transform:uppercase;font-weight:1000;letter-spacing:.03em}
.profile-section-heading:before{content:"";width:5px;height:23px;background:var(--driver-accent,#d71920);display:block}
.profile-stats{margin:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:0;gap:9px;background:transparent}
.profile-stat{min-width:0;border:1px solid #313745!important;background:#191e28;padding:23px 18px!important}
.profile-stat b{font-size:clamp(23px,3vw,36px);color:#fff}.profile-stat span{font-size:10px;line-height:1.3;color:#abb3c0}
.profile-insights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.profile-insight{padding:22px;background:#191e28;border:1px solid #313745}
.profile-insight span{display:block;font-size:10px;color:#aeb5c1;letter-spacing:.1em;text-transform:uppercase}
.profile-insight strong{display:block;margin-top:9px;font-size:28px;color:#fff}
.profile-insight small{display:block;margin-top:7px;font-size:11px;color:#aeb5c1}
.profile-form{display:flex;flex-wrap:wrap;gap:8px;padding:15px 0}
.profile-form span{display:inline-flex;justify-content:center;align-items:center;min-width:49px;height:49px;background:#202633;border:1px solid #3c4554;color:#fff;font-weight:1000}
.profile-form .form-win{background:#246a39;border-color:#37834c}.profile-form .form-top5{background:#314966;border-color:#446c9d}
.history-wrap{background:#171c25;border-color:#343b47;margin-top:18px}.history-head{color:#fff;border-color:#343b47} .profile-view th{background:#222936;color:#c4cbd5;border-color:#343b47}.profile-view td{background:#171c25;color:#f0f1f3;border-color:#343b47}.profile-view .win{color:#77dd91}
.profile-missing{display:flex;align-items:center;justify-content:center;height:100%;min-height:400px;font-size:clamp(80px,13vw,180px);color:rgba(255,255,255,.2);font-weight:1000;font-style:italic}
@media(max-width:1050px){.profile-hero{grid-template-columns:1fr 1fr;min-height:580px}.profile-photo{grid-column:2;min-height:580px}.profile-copy{padding:45px 12px 40px 34px}.profile-hero-stats{grid-column:1/-1;grid-row:2;display:block;padding:25px 30px}.profile-hero-stat-grid{grid-template-columns:repeat(4,1fr)}.profile-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.profile-shell{width:calc(100% - 20px)}.profile-hero{display:grid;grid-template-columns:1fr;min-height:0}.profile-copy{grid-column:1;grid-row:1;min-height:420px;padding:28px 22px}.profile-copy h2{font-size:clamp(40px,11vw,70px);max-width:67%;margin-top:25px}.profile-identity-number{font-size:80px}.profile-photo{grid-column:1;grid-row:1;min-height:420px;overflow:hidden}.profile-photo .profile-cutout{height:90%;left:70%;max-height:400px}.profile-hero-stats{grid-column:1;grid-row:2;padding:25px 20px}.profile-hero-stat-grid{grid-template-columns:repeat(2,1fr)}.profile-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.profile-insights{grid-template-columns:1fr}.profile-stat{padding:18px 12px!important}.profile-insight{padding:18px}}

</style>
</head>
<body>
<div id="directoryView" class="driver-page">
  <header class="driver-heading">
    <div class="driver-heading-inner">
      <div class="eyebrow">High Line Racing Network</div>
      <h1>HLRN <span>Drivers</span></h1>
      <p>Official HLRN driver roster, statistics and race history.</p>
    </div>
  </header>

  <div class="league-tabs" role="tablist" aria-label="Choose league"><button id="sundayTab" class="league-tab active" data-league="sunday" role="tab" aria-selected="true">SUNDAY LEAGUE</button><button id="mondayTab" class="league-tab" data-league="monday" role="tab" aria-selected="false">MONDAY LEAGUE</button></div>
  <div class="roster-tools">

      <div class="roster-title">HLRN Drivers</div>

    <label class="search-wrap" aria-label="Search drivers"><input id="search" type="search" placeholder="Search driver or car number" autocomplete="off"></label>

</div>

  <div class="profile-shell">
    <button id="backToDirectory" class="profile-back" type="button">← All Drivers</button>
    <div id="profileContent"></div>
  </div>
</section>

function hLrnPhotoKey(name){
  let s=String(name||"").trim();

  if(s.includes(",")){
    const p=s.split(",");
    const last=(p.shift()||"").trim();
    const first=p.join(" ").trim();
    s=(first+" "+last).trim();
  }

  // Strip iRacing duplicate suffixes, e.g. Wilson21 / Hebbard2.
  s=s.replace(/(\p{L})\d+$/u,"$1").trim();

  const clean=v=>String(v||"")
    .toLowerCase()
    .replace(/&/g,"and")
    .replace(/[^a-z0-9]/g,"");

  let k=clean(s);

  // Known aliases first.
  if(HLRN_DRIVER_PHOTO_ALIASES[k]) k=HLRN_DRIVER_PHOTO_ALIASES[k];
  if(HLRN_DRIVER_CUTOUT_PHOTOS[k]) return k;

  const stripped=k.replace(/\d+/g,"");
  if(HLRN_DRIVER_PHOTO_ALIASES[stripped]) k=HLRN_DRIVER_PHOTO_ALIASES[stripped];
  else k=stripped;

  if(HLRN_DRIVER_CUTOUT_PHOTOS[k]) return k;

  // Common first-name / spelling variants.
  const variants=[
    ["joshua","josh"],["josh","joshua"],
    ["matthew","matt"],["matt","matthew"],
    ["michael","mike"],["mike","michael"],
    ["nicholas","nick"],["nick","nicholas"],
    ["christopher","chris"],["chris","christopher"],
    ["timothy","tim"],["tim","timothy"],
    ["zachary","zack"],["zack","zachary"],
    ["zachary","zach"],["zach","zachary"],
    ["vincent","vicente"],["vicente","vincent"],
    ["vincent","vincente"],["vincente","vincent"],
    ["vicente","vincente"],["vincente","vicente"]
  ];

  for(const [from,to] of variants){
    if(k.startsWith(from)){
      let candidate=to+k.slice(from.length);
      if(HLRN_DRIVER_PHOTO_ALIASES[candidate]) candidate=HLRN_DRIVER_PHOTO_ALIASES[candidate];
      if(HLRN_DRIVER_CUTOUT_PHOTOS[candidate]) return candidate;
    }
  }

  // Safe typo tolerance across every cutout filename.
  function editDistance(a,b){
    a=String(a||""); b=String(b||"");
    const n=b.length;
    const prev=Array.from({length:n+1},(_,i)=>i);
    const cur=new Array(n+1);

    for(let i=1;i<=a.length;i++){
      cur[0]=i;
      for(let j=1;j<=n;j++){
        cur[j]=Math.min(
          cur[j-1]+1,
          prev[j]+1,
          prev[j-1]+(a[i-1]===b[j-1]?0:1)
        );
      }
      for(let j=0;j<=n;j++) prev[j]=cur[j];
    }
    return prev[n];
  }

  let bestKey="";
  let best=999;
  let second=999;

  for(const photoKey of Object.keys(HLRN_DRIVER_CUTOUT_PHOTOS)){
    const d=editDistance(k,photoKey);
    if(d<best){
      second=best;
      best=d;
      bestKey=photoKey;
    }else if(d<second){
      second=d;
    }
  }

  const maxDistance=k.length>=14?3:(k.length>=8?2:1);

  // Only use fuzzy matching when the best result is clearly the best result.
  if(best<=maxDistance && second>best){
    return bestKey;
  }

  return k;
}

  if(s.includes(",")){

    const last=(parts.shift()||"").trim();
    const first=parts.join(" ").trim();
    s=(first+" "+last).trim();
  }

  // Clean iRacing duplicate suffixes such as Wilson21 / Hebbard2.
  s=s.replace(/(\p{L})\d+$/u,"$1").trim();

  const fixes={
    "Randy Schweitzer RSI":"Randy Schweitzer",
    "Joshua McKinney2":"Joshua McKinney",
    "Josh Mckinney":"Joshua McKinney",
    "Ryan Wilson21":"Ryan Wilson",
    "Brian Hebbard2":"Brian Hebbard",

}


function normalizeDriver(d){

    ...d,

    carNumber:getDriverNumber(d.driver||d.name||"",d.carNumber||d.number||""),
    starts:d.starts??d.races??0,

    top5:d.top5??0,
    top10:d.top10??0,
    averageFinish:d.averageFinish??d.avgFinish??"—",

}

function driverNumberKey(name){
  let s=String(name||"").trim();

  if(s.includes(",")){
    const parts=s.split(",");
    const last=(parts.shift()||"").trim();
    const first=parts.join(" ").trim();
    s=(first+" "+last).trim();
  }

  return s.toLowerCase().replace(/[^a-z0-9]/g,"");
}

function getDriverNumber(name,apiNumber){
  const raw=driverNumberKey(name);

  if(KNOWN_DRIVER_NUMBERS[raw]){
    return KNOWN_DRIVER_NUMBERS[raw];
  }

  const noTrailingNumber=raw.replace(/\d+$/,"");

  if(KNOWN_DRIVER_NUMBERS[noTrailingNumber]){
    return KNOWN_DRIVER_NUMBERS[noTrailingNumber];
  }

  if(typeof hLrnPhotoKey==="function"){
    const photoKey=hLrnPhotoKey(name);
    if(KNOWN_DRIVER_NUMBERS[photoKey]){
      return KNOWN_DRIVER_NUMBERS[photoKey];
    }
  }

  if(apiNumber && apiNumber!=="—"){
    return String(apiNumber);
  }

  return "—";
}

function displayNameFromFile(file){

}

function mergeKey(name){
  const photoKey=hLrnPhotoKey(name);
  if(photoKey && HLRN_DRIVER_CUTOUT_PHOTOS[photoKey]) return photoKey;
  return String(name||"").toLowerCase().replace(/\d+$/,"").replace(/[^a-z0-9]/g,"");
}

function jsonp(action, league){
  return new Promise((resolve,reject)=>{
    const cb="hlrn_"+action+"_"+league+"_"+Date.now()+"_"+Math.floor(Math.random()*100000);
    let done=false;
    const cleanup=()=>{
      if(done) return;
      done=true;
      try{delete window[cb]}catch{}
      try{script.remove()}catch{}
      clearTimeout(timer);
    };
    window[cb]=(data)=>{cleanup();resolve(data)};
    const script=document.createElement("script");
    script.async=true;
    script.src=HLRN_API_URL+"?action="+encodeURIComponent(action)+"&league="+encodeURIComponent(league)+"&callback="+encodeURIComponent(cb)+"&t="+Date.now();
    script.onerror=()=>{cleanup();reject(new Error(action+" "+league+" failed"))};
    document.body.appendChild(script);
    const timer=setTimeout(()=>{cleanup();reject(new Error(action+" "+league+" timed out"))},25000);
  });
}

function combineDriverFeeds(feeds, resultFeeds){
  const map=new Map();
  const idToKey=new Map();

  feeds.forEach(feed=>{
    const league=String(feed?.league||"").toLowerCase() || "league";
    const list=Array.isArray(feed?.drivers)?feed.drivers:[];
    list.forEach(raw=>{
      const d=normalizeDriver(raw);
      const key=mergeKey(d.driver);
      if(!key) return;
      if(!map.has(key)){
        map.set(key,{
          driver:prettyName(d.driver),carNumber:d.carNumber||KNOWN_DRIVER_NUMBERS[hLrnPhotoKey(d.driver)]||"—",
          starts:0,wins:0,top5:0,top10:0,points:0,
          _avgWeighted:0,_avgStarts:0,bestFinish:null,lapsLed:0,
          leagueStats:{},history:[],_fallback:false
        });
      }
      const out=map.get(key);
      out.driver=prettyName(out.driver||d.driver);
      if(!out.carNumber || out.carNumber==="—"){
        out.carNumber=getDriverNumber(d.driver,d.carNumber);
      }
      const starts=num(d.starts||d.races);
      const avg=Number(d.averageFinish);
      out.starts+=starts;
      out.wins+=num(d.wins);
      out.top5+=num(d.top5);
      out.top10+=num(d.top10);
      out.points+=num(d.points);
      if(Number.isFinite(avg) && starts>0){
        out._avgWeighted+=avg*starts;
        out._avgStarts+=starts;
      }
      out.leagueStats[league]={
        rank:d.rank??"—",change:d.change??0,points:num(d.points),starts,
        wins:num(d.wins),top5:num(d.top5),top10:num(d.top10),
        averageFinish:Number.isFinite(avg)?avg:"—"
      };
      if(d.driverId!==undefined && d.driverId!==null && String(d.driverId)!==""){
        idToKey.set(league+"|"+String(d.driverId),key);
      }
    });
  });

  const allResults=[];
  resultFeeds.forEach(feed=>{
    const league=String(feed?.league||"").toLowerCase() || "league";
    const list=Array.isArray(feed?.results)?feed.results:[];
    list.forEach(r=>{
      const key=idToKey.get(league+"|"+String(r.driverId));
      if(!key || !map.has(key)) return;
      const out=map.get(key);
      const finish=Number(r.finish);
      if(Number.isFinite(finish) && finish>0){
        if(out.bestFinish===null || finish<out.bestFinish) out.bestFinish=finish;
      }
      out.lapsLed+=num(r.lapsLed);
      const row={...r,league};
      out.history.push(row);
      allResults.push({...row,driver:out.driver});
    });
  });

  liveResults=allResults;
  return [...map.values()].map(d=>{
    d.averageFinish=d._avgStarts?(d._avgWeighted/d._avgStarts).toFixed(2):"—";
    d.bestFinish=d.bestFinish===null?"—":d.bestFinish;
    delete d._avgWeighted; delete d._avgStarts;
    d.history.sort((a,b)=>{
      const da=Date.parse(a.date||"")||0, db=Date.parse(b.date||"")||0;
      if(db!==da) return db-da;
      return num(b.raceNumber)-num(a.raceNumber);
    });
    return d;
  }).sort((a,b)=>lastName(a.driver).localeCompare(lastName(b.driver))||a.driver.localeCompare(b.driver));
}

// Each league loads and caches independently; a failed feed never blocks the other tab.
const HLRN_DRIVER_REFRESH_MS=5*60*1000;
const HLRN_LEAGUE_CACHE_KEY="hlrn-driver-tabs-v1";
let activeLeague="sunday";
const leagueData={sunday:{drivers:[],updated:0,loading:false,results:[]},monday:{drivers:[],updated:0,loading:false,results:[]}};
function readLeagueCache(){try{return JSON.parse(localStorage.getItem(HLRN_LEAGUE_CACHE_KEY)||"{}")||{};}catch{return {};}}
function saveLeagueCache(){try{localStorage.setItem(HLRN_LEAGUE_CACHE_KEY,JSON.stringify(leagueData));}catch{}}
function leagueLabel(league){return league==="sunday"?"Sunday":"Monday";}
function makeLeagueDrivers(league,driverFeed,resultFeed){
  const result=combineDriverFeeds([driverFeed],resultFeed?[resultFeed]:[]);
  return result.map(d=>({...d,history:(d.history||[]).filter(r=>r.league===league),leagueStats:{[league]:d.leagueStats?.[league]}}));
}
function renderActiveLeague(){
  const data=leagueData[activeLeague];drivers=data.drivers;
  liveDataAvailable=!!data.updated;
  searchDrivers();
  const count=document.getElementById("driverCount");
  count.textContent=`${drivers.length} ${leagueLabel(activeLeague)} drivers • ${data.loading?"checking updates…":data.updated?"league stats loaded":"waiting for league data…"}`;
}
function setLeague(league){
  if(!leagueData[league])return;
  activeLeague=league;
  document.body.classList.toggle("monday-league",league==="monday");
  document.querySelectorAll(".league-tab").forEach(btn=>{const on=btn.dataset.league===league;btn.classList.toggle("active",on);btn.setAttribute("aria-selected",String(on));});
  document.getElementById("search").value="";
  document.getElementById("profileView").style.display="none";
  document.getElementById("directoryView").style.display="block";
  renderActiveLeague();
  refreshLeague(league);
}
async function refreshLeague(league){
  const state=leagueData[league];
  if(state.loading||Date.now()-state.updated<HLRN_DRIVER_REFRESH_MS)return;
  state.loading=true;
  if(activeLeague===league)renderActiveLeague();
  try{
    const feed=await jsonp("drivers",league);
    if(!feed||feed.success===false||!Array.isArray(feed.drivers))throw new Error("Invalid driver feed");
    // Show the league roster immediately; race history must not hold up the cards.
    state.drivers=makeLeagueDrivers(league,feed,null);
    state.updated=Date.now();saveLeagueCache();
    if(activeLeague===league)renderActiveLeague();
    try{
      const results=await jsonp("results",league);
      if(results&&results.success!==false&&Array.isArray(results.results)){
        state.drivers=makeLeagueDrivers(league,feed,results);
        saveLeagueCache();
        if(activeLeague===league){
          const open=document.getElementById("profileView").style.display==="block";
          if(open){const name=document.querySelector("#profileContent h2")?.textContent;const d=state.drivers.find(x=>x.driver===name);if(d)renderProfile(d);}
          else renderActiveLeague();
        }
      }
    }catch(e){console.warn("HLRN "+league+" race history unavailable",e);}
  }catch(e){console.warn("HLRN "+league+" driver feed unavailable",e);}
  finally{state.loading=false;if(activeLeague===league&&document.getElementById("profileView").style.display!=="block")renderActiveLeague();}
}
function initializeDrivers(){
  const cached=readLeagueCache();
  for(const league of ["sunday","monday"]){
    if(cached[league]&&Array.isArray(cached[league].drivers)){
      leagueData[league].drivers=cached[league].drivers;
      leagueData[league].updated=Number(cached[league].updated)||0;
    }
  }
  setLeague("sunday");
  // Start Monday independently, so switching tabs is fast.
  refreshLeague("monday");
  setInterval(()=>{if(document.visibilityState==="visible"){refreshLeague("sunday");refreshLeague("monday");}},60000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){refreshLeague("sunday");refreshLeague("monday");}});
}

 const car=n==="—"?"HLRN DRIVER":`Car <strong>#${esc(n)}</strong>`;
 return `<button class="driver-card" type="button" data-driver="${esc(name)}" aria-label="Open ${esc(name)} profile">
   <div class="driver-media">
     <div class="number-badge">${esc(n)}</div><div class="status-chip">HLRN DRIVER</div>
     <div class="driver-fallback">${n==="—"?"HLRN":"#"+esc(n)}</div>
     ${photo?`<img class="driver-cutout" src="${esc(photo)}" alt="${esc(name)}" loading="lazy" decoding="async" onerror="this.remove()">`:``}
   </div>
   <div class="driver-info">
     <div class="driver-name">${esc(name)}</div>
     <div class="driver-sub"><span>${car}</span><span class="win-mark">${right}</span></div>
     <div class="driver-stats">
       <div class="mini-stat"><b>${esc(d.starts)}</b><span>Starts</span></div>
       <div class="mini-stat"><b>${esc(d.wins)}</b><span>Wins</span></div>

     </div>
   </div>
 </button>`
}
function renderDrivers(list){document.getElementById("driverCount").textContent=`${list.length} ${list.length===1?'driver':'drivers'}`;document.getElementById("driverGrid").innerHTML=list.length?list.map(card).join(""):`<div class="no-card">No drivers found.</div>`}
function showError(msg){document.getElementById("driverGrid").innerHTML=`<div class="error-card"><strong>DRIVER DATABASE CONNECTION ERROR</strong><br><br>${esc(msg)}</div>`}
function searchDrivers(){const q=document.getElementById("search").value.toLowerCase().trim();renderDrivers(drivers.filter(d=>prettyName(d.driver).toLowerCase().includes(q)||String(d.carNumber).toLowerCase().includes(q)))}

function openProfile(name){
  document.getElementById("directoryView").style.display="none";
  document.getElementById("profileView").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
  const local=drivers.find(d=>d.driver===name);
  renderProfile(local||{driver:name,carNumber:"—",starts:"—",wins:"—",top5:"—",top10:"—",averageFinish:"—",bestFinish:"—",history:[],_fallback:true,leagueStats:{}});
}
function leagueStatCards(d){
  const leagues=[activeLeague];
  return leagues.map(k=>{
    const s=d.leagueStats&&d.leagueStats[k];
    if(!s) return "";
    const label=k==="sunday"?"Sunday League":"Monday League";
    return `<div class="profile-stat"><b>#${esc(s.rank)}</b><span>${label} Rank</span></div>`;
  }).join("");
}
/* Suit colors are sampled from the driver's actual cutout image rather than assigned by league.
   Explicit entries below are based on the three supplied photos; other suits are sampled in-browser.
   If the image host blocks pixel reading, a neutral charcoal background is used instead. */
const HLRN_SUIT_COLORS={
  evanfuqua:{base:"#971b29",accent:"#e43843"},
  evankarlbon:{base:"#176a30",accent:"#63c926"},
  javonethompson:{base:"#12417e",accent:"#2585ec"}
};
const HLRN_SUIT_CACHE=new Map();
function suitPalette(name){return HLRN_SUIT_COLORS[hLrnPhotoKey(name)]||HLRN_SUIT_CACHE.get(hLrnPhotoKey(name))||{base:"#303743",accent:"#dc3544"};}
function setSuitStyle(hero,palette){
  if(!hero)return;
  const hex=palette.base;
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  hero.style.setProperty("--suit",hex);
  hero.style.setProperty("--suit-dark",`rgb(${Math.round(r*.45)},${Math.round(g*.45)},${Math.round(b*.45)})`);
  hero.style.setProperty("--suit-accent",palette.accent);
  document.getElementById("profileContent").style.setProperty("--driver-accent",palette.accent);
}
function autoSuitColor(name,url){
  const key=hLrnPhotoKey(name);
  if(HLRN_SUIT_COLORS[key]||HLRN_SUIT_CACHE.has(key)||!url)return;
  const img=new Image();img.crossOrigin="anonymous";
  img.onload=()=>{
    try{
      const canvas=document.createElement("canvas");canvas.width=110;canvas.height=140;
      const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(img,0,0,110,140);
      const data=ctx.getImageData(0,0,110,140).data, buckets=new Map();
      // Sample the center/lower racing suit, not the face or transparent background.
      for(let y=70;y<134;y+=2)for(let x=20;x<90;x+=2){
        const i=(y*110+x)*4,r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
        if(a<180)continue;
        const max=Math.max(r,g,b),min=Math.min(r,g,b),sat=max-min;
        if(max>215&&sat<35)continue; // ignore white sponsor lettering
        const q=v=>Math.min(255,Math.round(v/32)*32);
        const k=[q(r),q(g),q(b)].join(",");buckets.set(k,(buckets.get(k)||0)+1);
      }
      const sorted=[...buckets].sort((a,b)=>b[1]-a[1]);
      if(!sorted.length)return;
      let primary=sorted[0][0].split(",").map(Number);
      // Black and dark gray suits retain a dark background; pick a colored trim where available.
      let trim=sorted.find(([k,n])=>{const v=k.split(",").map(Number);return Math.max(...v)-Math.min(...v)>55&&Math.max(...v)>75&&n>=2;});
      let accent=trim?trim[0].split(",").map(Number):primary;
      const hex=a=>"#"+a.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("");
      const palette={base:hex(primary),accent:hex(accent)};
      HLRN_SUIT_CACHE.set(key,palette);
      const hero=document.querySelector("#profileContent .profile-hero");
      if(hero&&hero.dataset.driverKey===key)setSuitStyle(hero,palette);
    }catch(e){console.info("Suit-color sampling unavailable; using neutral profile background.");}
  };
  img.src=url;
}
function displayMetric(v){return v===null||v===undefined||v===""||v==="—"?"—":v;}
function percentMetric(n,total){return !Number.isFinite(Number(total))||Number(total)<=0||n==="—"?"—":(100*num(n)/Number(total)).toFixed(1)+"%";}
function renderProfile(d){
  const hist=Array.isArray(d.history)?d.history:[];
  d.driver=prettyName(d.driver);d.carNumber=getDriverNumber(d.driver,d.carNumber);
  const photo=photoUrl(d.driver),key=hLrnPhotoKey(d.driver),league=d.leagueStats?.[activeLeague]||{};
  const ready=!d._fallback;
  const value=v=>ready?displayMetric(v):"—";
  const starts=value(d.starts),wins=value(d.wins),top5=value(d.top5),top10=value(d.top10);
  const stat=(label,v)=>`<div class="profile-stat"><b>${esc(v)}</b><span>${esc(label)}</span></div>`;
  const lead=(label,v)=>`<div class="profile-hero-stat"><span>${esc(label)}</span><b>${esc(v)}</b></div>`;
  const insight=(label,v,detail)=>`<div class="profile-insight"><span>${esc(label)}</span><strong>${esc(v)}</strong><small>${esc(detail)}</small></div>`;
  const rows=hist.length?hist.slice(0,30).map(r=>{
    const f=Number(r.finish);
    return `<tr><td>${esc(leagueLabel(activeLeague))}</td><td>${esc(r.raceNumber||"—")}</td><td>${esc(r.date||"—")}</td><td>${esc(r.track||"—")}</td><td class="${f===1?'win':f>1&&f<=5?'top5':''}">${esc(r.finish||"—")}</td><td>${esc(r.points??"—")}</td><td>${esc(r.lapsLed??"—")}</td><td>${esc(r.incidents??"—")}</td><td>${esc(r.status||"—")}</td></tr>`;
  }).join(""):`<tr><td colspan="9">${ready?"No race history available for this league.":"Race history is syncing."}</td></tr>`;
  const form=hist.filter(r=>Number(r.finish)>0).slice(0,5).map(r=>{
    const finish=Number(r.finish),cls=finish===1?"form-win":finish<=5?"form-top5":"";
    return `<span class="${cls}" title="${esc(r.track||"Race")}">P${esc(finish)}</span>`;
  }).join("");
  document.getElementById("profileContent").innerHTML=`
    <div class="profile-hero" data-driver-key="${esc(key)}">
      <div class="profile-copy">
        <div class="profile-kicker">High Line Racing Network / ${esc(leagueLabel(activeLeague))} League</div>
        <h2>${esc(d.driver)}</h2>
        <p>OFFICIAL HLRN DRIVER PROFILE</p>
        <div class="profile-label">${esc(leagueLabel(activeLeague))} League · #${esc(d.carNumber)}</div>
        <div class="profile-identity-number">${esc(d.carNumber)}</div>
      </div>
      <div class="profile-photo">
        ${photo?`<img class="profile-cutout" decoding="async" src="${esc(photo)}" alt="${esc(d.driver)}" onerror="this.remove()">`:`<div class="profile-missing">#${esc(d.carNumber)}</div>`}
      </div>
      <aside class="profile-hero-stats"><h3>Driver Statistics</h3><div class="profile-hero-stat-grid">
        ${lead("League rank",league.rank!=null&&league.rank!=="—"?"#"+league.rank:"—")}
        ${lead("League points",value(d.points))}
        ${lead("Race starts",starts)}
        ${lead("Career wins",wins)}
        ${lead("Top 5 finishes",top5)}
        ${lead("Top 10 finishes",top10)}
        ${lead("Average finish",value(d.averageFinish))}
        ${lead("Laps led",hist.length?value(d.lapsLed):"—")}
      </div></aside>
    </div>
    <div class="profile-section-heading">Season Performance</div>
    <div class="profile-stats">
      ${stat("Starts",starts)}${stat("Wins",wins)}${stat("Top 5",top5)}${stat("Top 10",top10)}
      ${stat("Average finish",value(d.averageFinish))}${stat("Best finish",hist.length?value(d.bestFinish):"—")}
      ${stat("Laps led",hist.length?value(d.lapsLed):"—")}${stat("Points",value(d.points))}
      ${stat("League position",league.rank!=null&&league.rank!=="—"?"#"+league.rank:"—")}
      ${stat("Recorded results",hist.length?hist.length:"—")}
    </div>
    <div class="profile-section-heading">Performance Breakdown</div>
    <div class="profile-insights">
      ${insight("Win percentage",ready?percentMetric(wins,starts):"—","Wins divided by league starts")}
      ${insight("Top 5 percentage",ready?percentMetric(top5,starts):"—","Top 5 finishes divided by league starts")}
      ${insight("Top 10 percentage",ready?percentMetric(top10,starts):"—","Top 10 finishes divided by league starts")}
      ${insight("Points per start",ready&&num(starts)>0?(num(d.points)/num(starts)).toFixed(1):"—","League points divided by starts")}
      ${insight("Incidents recorded",hist.length?hist.reduce((t,r)=>t+num(r.incidents),0):"—","From available race history")}
      ${insight("Average laps led",hist.length?(hist.reduce((t,r)=>t+num(r.lapsLed),0)/hist.length).toFixed(1):"—","Across available race results")}
    </div>
    <div class="profile-section-heading">Recent Race Form</div>
    <div class="profile-form">${form||"<span>—</span>"}</div>
    <div class="history-wrap"><div class="history-head">Recent ${esc(leagueLabel(activeLeague))} Results</div>
      <table><thead><tr><th>League</th><th>Race</th><th>Date</th><th>Track</th><th>Finish</th><th>Points</th><th>Laps Led</th><th>Incidents</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  setSuitStyle(document.querySelector("#profileContent .profile-hero"),suitPalette(d.driver));
  autoSuitColor(d.driver,photo);
}

function showDirectory(){document.getElementById("profileView").style.display="none";document.getElementById("directoryView").style.display="block";window.scrollTo({top:0,behavior:"smooth"})}

document.addEventListener("DOMContentLoaded",()=>{document.getElementById("search").addEventListener("input",searchDrivers);document.getElementById("driverGrid").addEventListener("click",e=>{const c=e.target.closest(".driver-card");if(c)openProfile(c.dataset.driver)});document.getElementById("backToDirectory").addEventListener("click",showDirectory);document.querySelectorAll(".league-tab").forEach(btn=>btn.addEventListener("click",()=>setLeague(btn.dataset.league)));initializeDrivers()});
</script>
